<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js" defer></script>
</head>

<body>
    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card">
            <h1 class="card-header text-center">Shopping Cart</h1>
            <div class="card-body">
                <div id="cart-message" class="alert alert-info mt-1"><strong></strong></div>
                <label for="item-name" class="form-label">Enter an Item:</label>
                <input type="text" id="item-name" class="form-control" placeholder="Type your item name...">
                <div class="container mt-2">
                <button id="add-item-button" class="btn btn-primary mt-2">Add New Item</button>
                <button id="remove-last-item" class="btn btn-danger mt-2">Remove Last Item</button>   
                </div>             
                <h4 class="text-center mt-4">Cart</h4>
                <ul id="cart-items" class="list-group"></ul>
            </div>
        </div>
    </main>
</body>

</html>
